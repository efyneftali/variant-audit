<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Tiempos Text', Georgia, 'Times New Roman', serif">
  <title>Variant Audit architecture — the agent is the system under test; the harness is the point</title>
  <desc>The eval harness (purple) wraps the agent (blue), a LangGraph state machine. The agent draws criteria from a RAG rulebook (green) and evidence from MCP tools (amber), then the harness grades its output against ClinVar ground truth (green).</desc>
  <defs>
    <style>
      .sans { font-family: 'Styrene B','Inter',system-ui,sans-serif; }
      .kick { font-family: 'Styrene B','Inter',system-ui,sans-serif; letter-spacing:1.5px; }
    </style>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F7396"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B4894E"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6E8B62"/></marker>
    <marker id="aP" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6F98"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="660" rx="14" fill="#F0EEE6"/>

  <!-- header -->
  <text x="40" y="34" class="kick" font-size="11" fill="#CC785C">VARIANT AUDIT — ARCHITECTURE</text>
  <text x="40" y="63" font-size="21" fill="#1F1E1D">The agent is the system under test — the harness is the point.</text>

  <!-- HARNESS wrapper (purple) -->
  <rect x="28" y="82" width="844" height="498" rx="22" fill="#F4F0F6" stroke="#8A6F98" stroke-width="2"/>
  <rect x="48" y="100" width="150" height="26" rx="13" fill="#8A6F98"/>
  <text x="123" y="117" class="kick" font-size="11" fill="#FAF9F5" text-anchor="middle">EVAL HARNESS</text>
  <text x="212" y="117" class="sans" font-size="12.5" fill="#56406A" font-style="italic">grades the agent against authoritative ground truth</text>

  <!-- GREEN — RAG rulebook -->
  <rect x="56" y="146" width="200" height="150" rx="12" fill="#E3ECDC" stroke="#6E8B62" stroke-width="1.5"/>
  <text x="74" y="176" class="kick" font-size="10.5" fill="#6E8B62">RAG — THE RULEBOOK</text>
  <text x="74" y="200" font-size="16" fill="#445639">ACMG / ClinGen</text>
  <text x="74" y="221" class="sans" font-size="12" fill="#5a6b4f">Classification guidelines,</text>
  <text x="74" y="237" class="sans" font-size="12" fill="#5a6b4f">not model memory</text>
  <rect x="74" y="252" width="164" height="28" rx="14" fill="#FAF9F5" stroke="#6E8B62" stroke-width="1"/>
  <text x="156" y="270" class="sans" font-size="11.5" fill="#445639" text-anchor="middle">retrieved ACMG criteria</text>

  <!-- BLUE — the agent -->
  <rect x="300" y="146" width="300" height="172" rx="12" fill="#E4EBF1" stroke="#4F7396" stroke-width="1.5"/>
  <text x="320" y="174" class="kick" font-size="10.5" fill="#4F7396">THE AGENT — SYSTEM UNDER TEST</text>
  <text x="320" y="197" font-size="16" fill="#2E4A63">LangGraph state machine</text>
  <!-- step pills -->
  <g class="sans" font-size="11" text-anchor="middle" fill="#2E4A63">
    <rect x="320" y="214" width="58" height="28" rx="8" fill="#FAF9F5" stroke="#4F7396" stroke-width="1"/><text x="349" y="232">Gather</text>
    <rect x="387" y="214" width="58" height="28" rx="8" fill="#FAF9F5" stroke="#4F7396" stroke-width="1"/><text x="416" y="232">Grade</text>
    <rect x="454" y="214" width="62" height="28" rx="8" fill="#FAF9F5" stroke="#4F7396" stroke-width="1"/><text x="485" y="232">Classify</text>
    <rect x="525" y="214" width="56" height="28" rx="8" fill="#FAF9F5" stroke="#4F7396" stroke-width="1"/><text x="553" y="232">Check</text>
  </g>
  <g stroke="#4F7396" stroke-width="1.2" marker-end="url(#aB)">
    <line x1="379" y1="228" x2="385" y2="228"/>
    <line x1="446" y1="228" x2="452" y2="228"/>
    <line x1="517" y1="228" x2="523" y2="228"/>
  </g>
  <!-- bounded loop -->
  <path d="M551,244 C556,272 470,278 450,278 C430,278 352,272 350,244" fill="none" stroke="#4F7396" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#aB)"/>
  <text x="450" y="300" class="sans" font-size="10.5" fill="#4F7396" text-anchor="middle">bounded correction loops — guaranteed to terminate</text>

  <!-- AMBER — MCP tools -->
  <rect x="644" y="146" width="200" height="196" rx="12" fill="#F1E6D2" stroke="#B4894E" stroke-width="1.5"/>
  <text x="662" y="174" class="kick" font-size="10.5" fill="#B4894E">MCP TOOLS — LIVE EVIDENCE</text>
  <g class="sans" font-size="11.5" text-anchor="middle" fill="#79592D">
    <rect x="662" y="186" width="164" height="26" rx="13" fill="#FAF9F5" stroke="#B4894E" stroke-width="1"/><text x="744" y="203">ClinVar</text>
    <rect x="662" y="216" width="164" height="26" rx="13" fill="#FAF9F5" stroke="#B4894E" stroke-width="1"/><text x="744" y="233">gnomAD</text>
    <rect x="662" y="246" width="164" height="26" rx="13" fill="#FAF9F5" stroke="#B4894E" stroke-width="1"/><text x="744" y="263">UCSC</text>
    <rect x="662" y="276" width="164" height="26" rx="13" fill="#FAF9F5" stroke="#B4894E" stroke-width="1"/><text x="744" y="293">AlphaMissense</text>
    <rect x="662" y="306" width="164" height="26" rx="13" fill="#FAF9F5" stroke="#B4894E" stroke-width="1"/><text x="744" y="323">Ensembl / VEP</text>
  </g>

  <!-- arrows into agent -->
  <line x1="256" y1="212" x2="298" y2="212" stroke="#6E8B62" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="277" y="204" class="sans" font-size="10" fill="#6E8B62" text-anchor="middle">criteria</text>
  <line x1="644" y1="212" x2="602" y2="212" stroke="#B4894E" stroke-width="1.6" marker-end="url(#aA)"/>
  <text x="623" y="204" class="sans" font-size="10" fill="#B4894E" text-anchor="middle">evidence</text>

  <!-- agent -> grading -->
  <line x1="450" y1="318" x2="450" y2="372" stroke="#4F7396" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="462" y="350" class="sans" font-size="10.5" fill="#2E4A63">classification + cited criteria</text>

  <!-- GREEN — ClinVar ground truth -->
  <rect x="56" y="372" width="200" height="92" rx="12" fill="#E3ECDC" stroke="#6E8B62" stroke-width="1.5"/>
  <text x="74" y="400" class="kick" font-size="10.5" fill="#6E8B62">GROUND TRUTH</text>
  <text x="74" y="423" font-size="16" fill="#445639">ClinVar</text>
  <text x="74" y="445" class="sans" font-size="12" fill="#5a6b4f">the answer key — not a model input</text>

  <!-- PURPLE — grading -->
  <rect x="340" y="372" width="360" height="92" rx="12" fill="#EBE2EF" stroke="#8A6F98" stroke-width="1.5"/>
  <text x="360" y="400" class="kick" font-size="10.5" fill="#8A6F98">GRADING</text>
  <text x="360" y="423" font-size="16" fill="#56406A">Score vs ground truth</text>
  <text x="360" y="445" class="sans" font-size="11.5" fill="#6a5578">accuracy · harm-weighted error · faithfulness · robustness</text>

  <!-- clinvar -> grading -->
  <line x1="256" y1="418" x2="338" y2="418" stroke="#6E8B62" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="297" y="410" class="sans" font-size="10" fill="#6E8B62" text-anchor="middle">ground truth</text>

  <!-- failure-mining loop (routed in the left margin so it crosses no card) -->
  <path d="M520,464 L520,502 L42,502 L42,418 L54,418" fill="none" stroke="#8A6F98" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aP)"/>
  <text x="300" y="495" class="sans" font-size="10.5" fill="#8A6F98" text-anchor="middle">failure-mining loop — production misses re-enter the golden dataset</text>

  <!-- legend -->
  <g class="sans" font-size="11.5" fill="#3d3833">
    <rect x="40" y="606" width="15" height="15" rx="4" fill="#E4EBF1" stroke="#4F7396" stroke-width="1.5"/>
    <text x="63" y="618">Agent (system under test)</text>
    <rect x="248" y="606" width="15" height="15" rx="4" fill="#F1E6D2" stroke="#B4894E" stroke-width="1.5"/>
    <text x="271" y="618">MCP tools (live evidence)</text>
    <rect x="452" y="606" width="15" height="15" rx="4" fill="#E3ECDC" stroke="#6E8B62" stroke-width="1.5"/>
    <text x="475" y="618">RAG rulebook + ClinVar ground truth</text>
    <rect x="742" y="606" width="15" height="15" rx="4" fill="#EBE2EF" stroke="#8A6F98" stroke-width="1.5"/>
    <text x="765" y="618">Eval harness</text>
  </g>
</svg>
