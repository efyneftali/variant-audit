<svg viewBox="0 0 1840 1010" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3F6FA0"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C0392B"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9a9284"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1840" height="1010" fill="#EFE9DC"/>

  <!-- Title -->
  <text x="72" y="66" fill="#C4603C" font-size="22" font-weight="600" letter-spacing="3">THE REASONING WORKFLOW, DEBUGGED</text>
  <text x="70" y="116" fill="#2b2b2b" font-size="40" font-weight="600">Two structural bugs the eval harness caught</text>

  <!-- ============ BUG 1 callout (left) ============ -->
  <rect x="56" y="158" width="462" height="268" rx="14" fill="#F6DED9" stroke="#C0392B" stroke-width="1.5"/>
  <text x="80" y="188" fill="#A5281B" font-size="19" font-weight="700">BUG 1 · classify() is blind to 4/5 sources</text>
  <text x="80" y="214" fill="#5a2018" font-size="15">gather_evidence() collects all five MCP sources. But</text>
  <text x="80" y="235" fill="#5a2018" font-size="15">classify() and check_grounded() read only</text>
  <text x="80" y="256" fill="#5a2018" font-size="15">evidence['clinvar']['matches']. gnomAD, Ensembl, UCSC</text>
  <text x="80" y="277" fill="#5a2018" font-size="15">and AlphaMissense are gathered, used once by the</text>
  <text x="80" y="298" fill="#5a2018" font-size="15">sufficiency grade, then never reach the classifier.</text>
  <text x="80" y="319" fill="#8a4a40" font-size="13" font-style="italic">graph.py:159 to 180</text>
  <text x="80" y="347" fill="#5a2018" font-size="15">syn-001 / KCNC2: ClinVar was empty, so classify() saw</text>
  <text x="80" y="368" fill="#5a2018" font-size="15">"No ClinVar record found." The 7.3% gnomAD frequency,</text>
  <text x="80" y="389" fill="#5a2018" font-size="15">the one fact ruling out pathogenic, sat stranded</text>
  <text x="80" y="410" fill="#5a2018" font-size="15">upstream → model invented PM5/PP3, said Likely Path.</text>

  <!-- ============ Evidence bundle (Bug 1 top) ============ -->
  <rect x="556" y="172" width="556" height="118" rx="12" fill="#DCE6F1" stroke="#3F6FA0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="570" y="200" fill="#1f2d3d" font-size="15" font-weight="600">state['evidence']  ·  populated by gather_evidence() — all 5 MCP tools</text>
  <!-- chips -->
  <g font-size="14" text-anchor="middle">
    <rect x="570" y="222" width="96" height="46" rx="8" fill="#EAF0F7" stroke="#3F6FA0"/>
    <text x="618" y="250" fill="#1f2d3d">ClinVar</text>
    <rect x="678" y="222" width="96" height="46" rx="8" fill="#FBEAE6" stroke="#C0392B" stroke-width="1.5"/>
    <text x="726" y="243" fill="#A5281B" font-weight="600">gnomAD</text>
    <text x="726" y="260" fill="#A5281B" font-size="12">AF 7.3%</text>
    <rect x="786" y="222" width="96" height="46" rx="8" fill="#EAF0F7" stroke="#3F6FA0"/>
    <text x="834" y="250" fill="#1f2d3d">Ensembl</text>
    <rect x="894" y="222" width="96" height="46" rx="8" fill="#EAF0F7" stroke="#3F6FA0"/>
    <text x="942" y="250" fill="#1f2d3d">UCSC</text>
    <rect x="1002" y="222" width="96" height="46" rx="8" fill="#EAF0F7" stroke="#3F6FA0"/>
    <text x="1050" y="247" fill="#1f2d3d" font-size="13">Alpha-</text>
    <text x="1050" y="262" fill="#1f2d3d" font-size="13">Missense</text>
  </g>

  <!-- evidence -> grade (all 5, fine) -->
  <path d="M626,290 L660,452" fill="none" stroke="#3F6FA0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="536" y="352" fill="#3F6FA0" font-size="13.5">grade_evidence()</text>
  <text x="536" y="370" fill="#3F6FA0" font-size="13.5">reads all 5 →</text>
  <text x="536" y="388" fill="#3F6FA0" font-size="13.5">sufficient=True</text>

  <!-- evidence -> gate -->
  <path d="M994,290 L994,326" fill="none" stroke="#7d8a97" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- gate: the culprit function -->
  <rect x="836" y="330" width="316" height="58" rx="10" fill="#FBEAE6" stroke="#C0392B" stroke-width="1.5"/>
  <text x="994" y="354" fill="#A5281B" font-size="14" font-weight="700" text-anchor="middle">_build_evidence_and_criteria_text()</text>
  <text x="994" y="374" fill="#A5281B" font-size="13.5" text-anchor="middle">keeps only clinvar.matches</text>

  <!-- gate -> classify (only clinvar) -->
  <path d="M994,388 L994,452" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="1004" y="424" fill="#A5281B" font-size="13.5">only clinvar.matches ↓</text>

  <!-- dropped cluster -->
  <path d="M1152,358 L1196,358" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="1204" y="322" fill="#A5281B" font-size="13.5" font-weight="600">dropped before classify() ✕</text>
  <g font-size="13" text-anchor="middle">
    <rect x="1204" y="332" width="132" height="30" rx="7" fill="#E9E4D8" stroke="#C0392B" stroke-width="1.5"/>
    <text x="1270" y="352" fill="#A5281B">gnomAD 7.3%</text>
    <rect x="1344" y="332" width="96" height="30" rx="7" fill="#E9E4D8" stroke="#b9b1a2"/>
    <text x="1392" y="352" fill="#7a7365">Ensembl</text>
    <rect x="1204" y="368" width="132" height="30" rx="7" fill="#E9E4D8" stroke="#b9b1a2"/>
    <text x="1270" y="388" fill="#7a7365">UCSC</text>
    <rect x="1344" y="368" width="96" height="30" rx="7" fill="#E9E4D8" stroke="#b9b1a2"/>
    <text x="1392" y="384" fill="#7a7365" font-size="11">Alpha-</text>
    <text x="1392" y="396" fill="#7a7365" font-size="11">Missense</text>
  </g>

  <!-- ============ MIDDLE NODE ROW ============ -->
  <!-- start pill -->
  <rect x="64" y="470" width="132" height="90" rx="45" fill="#E7E1D0" stroke="#8B846A" stroke-width="1.5" filter="url(#soft)"/>
  <text x="130" y="521" fill="#4a4636" font-size="19" text-anchor="middle">variant</text>

  <!-- gather -->
  <rect x="232" y="460" width="240" height="110" rx="14" fill="#DCE6F1" stroke="#3F6FA0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="352" y="507" fill="#1f2d3d" font-size="23" text-anchor="middle">Gather evidence</text>
  <text x="352" y="533" fill="#5c6b7a" font-size="15" text-anchor="middle">calls all 5 MCP tools</text>

  <!-- grade -->
  <rect x="552" y="460" width="240" height="110" rx="14" fill="#DCE6F1" stroke="#3F6FA0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="672" y="507" fill="#1f2d3d" font-size="23" text-anchor="middle">Grade sufficiency</text>
  <text x="672" y="533" fill="#5c6b7a" font-size="15" text-anchor="middle">sees all 5 · says "enough"</text>

  <!-- classify (bug-tinted) -->
  <rect x="872" y="460" width="240" height="110" rx="14" fill="#F6DED9" stroke="#C0392B" stroke-width="2" filter="url(#soft)"/>
  <text x="992" y="507" fill="#7a241a" font-size="23" text-anchor="middle">Classify</text>
  <text x="992" y="533" fill="#A5281B" font-size="15" text-anchor="middle">ClinVar only · → P · VUS · B</text>

  <!-- check grounded (bug-tinted) -->
  <rect x="1192" y="460" width="240" height="110" rx="14" fill="#F6DED9" stroke="#C0392B" stroke-width="2" filter="url(#soft)"/>
  <text x="1312" y="507" fill="#7a241a" font-size="23" text-anchor="middle">Check grounded</text>
  <text x="1312" y="533" fill="#A5281B" font-size="15" text-anchor="middle">flags it, cannot fix it</text>

  <!-- return pill -->
  <rect x="1520" y="470" width="160" height="90" rx="45" fill="#DCE6F1" stroke="#3F6FA0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1600" y="521" fill="#1f2d3d" font-size="19" text-anchor="middle">return</text>

  <!-- straight-line flow arrows -->
  <path d="M196,515 L228,515" fill="none" stroke="#3F6FA0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M472,515 L548,515" fill="none" stroke="#3F6FA0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M792,515 L868,515" fill="none" stroke="#3F6FA0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="830" y="502" fill="#3F6FA0" font-size="13.5" text-anchor="middle">sufficient</text>
  <path d="M1112,515 L1188,515" fill="none" stroke="#3F6FA0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M1432,515 L1516,515" fill="none" stroke="#3F6FA0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1474" y="502" fill="#3F6FA0" font-size="12.5" text-anchor="middle">grounded / budget</text>

  <!-- outcome chip -->
  <path d="M1600,560 L1600,584" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="1500" y="586" width="200" height="40" rx="10" fill="#FBEAE6" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1600" y="611" fill="#A5281B" font-size="14" font-weight="600" text-anchor="middle">ships grounded=False</text>

  <!-- insufficient loop (neutral, this one is fine) -->
  <path d="M672,572 C650,662 384,662 358,574" fill="none" stroke="#9a9284" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/>
  <text x="515" y="678" fill="#8a8272" font-size="14" text-anchor="middle">insufficient → gather more · bounded (works fine)</text>

  <!-- ============ BUG 2: reclassify loop ============ -->
  <path d="M1312,572 C1298,690 1008,690 994,574" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <text x="1153" y="616" fill="#A5281B" font-size="14" text-anchor="middle">not grounded → reclassify · bounded</text>
  <!-- discarded critique marker -->
  <text x="1153" y="672" fill="#A5281B" font-size="13.5" text-anchor="middle" font-style="italic">the critique (the "why") is discarded ✕</text>

  <!-- BUG 2 callout -->
  <rect x="812" y="700" width="640" height="176" rx="14" fill="#F6DED9" stroke="#C0392B" stroke-width="1.5"/>
  <text x="836" y="732" fill="#A5281B" font-size="20" font-weight="700">BUG 2  ·  the retry cannot recover</text>
  <text x="836" y="762" fill="#5a2018" font-size="15.5">check_grounded() flags the answer "ungrounded" and returns a one-line reason.</text>
  <text x="836" y="784" fill="#5a2018" font-size="15.5">That reason is discarded. classify() rebuilds the identical prompt from the same</text>
  <text x="836" y="806" fill="#5a2018" font-size="15.5">state, so attempt 2 equals attempt 1: ungrounded again. gen_retries hits budget,</text>
  <text x="836" y="828" fill="#5a2018" font-size="15.5">route_after_groundedness sends the graph to END, shipping the answer anyway.</text>
  <text x="836" y="856" fill="#8a4a40" font-size="14" font-style="italic">The safety net fires correctly. Nothing gets recovered, because attempt 2 has no new input.</text>

  <!-- ============ Legend + trace stamp ============ -->
  <g font-size="15">
    <line x1="72" y1="920" x2="112" y2="920" stroke="#3F6FA0" stroke-width="2.5"/>
    <text x="122" y="925" fill="#5c6b7a">normal data flow</text>
    <line x1="320" y1="920" x2="360" y2="920" stroke="#C0392B" stroke-width="2.5"/>
    <text x="370" y="925" fill="#5c6b7a">bug / broken data flow</text>
    <line x1="620" y1="920" x2="660" y2="920" stroke="#9a9284" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="670" y="925" fill="#5c6b7a">bounded loop (always terminates)</text>
  </g>
  <text x="72" y="965" fill="#7a7365" font-size="14.5" font-style="italic">Both genuine misses (gv-025, syn-001): sufficient=True · rewrites=0 · grounded=False · gen_retries=1 — the judge caught them, the graph shipped them anyway.</text>
</svg>
